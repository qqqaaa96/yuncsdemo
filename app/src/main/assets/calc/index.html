<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>计算器</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f6f6f6;
    --ink: #111111;
    --soft: #666666;
    --faint: #9a9a9a;
    --line: #e6e6e6;
    --accent: #1b6ef3;
    --warn: #d97706;
    --bad: #cc2222;
    --good: #17803d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; height: 100vh; }

  /* 顶部标签栏 */
  .tabs {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px;
    border-bottom: 1px solid var(--line); flex: none;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; padding: 7px 13px; border-radius: 15px;
    background: var(--card); color: var(--soft);
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    border: none; font-family: inherit;
  }
  .tab.on { background: var(--accent); color: #fff; }

  /* 面板 */
  .panels { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .panel { display: none; padding: 12px; }
  .panel.on { display: block; }

  /* 显示屏 */
  .screen {
    background: var(--card); border-radius: 14px; padding: 14px;
    margin-bottom: 10px; min-height: 92px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .expr {
    font-size: 13px; color: var(--soft); text-align: right;
    font-family: ui-monospace, Menlo, monospace;
    word-break: break-all; min-height: 18px; line-height: 1.4;
  }
  .result {
    font-size: 30px; font-weight: 700; text-align: right;
    font-family: ui-monospace, Menlo, monospace;
    margin-top: 6px; word-break: break-all; line-height: 1.2;
  }
  .result.err { color: var(--bad); font-size: 19px; }

  /* 按键 */
  .keys { display: grid; gap: 8px; }
  .keys.c4 { grid-template-columns: repeat(4, 1fr); }
  .keys.c5 { grid-template-columns: repeat(5, 1fr); }
  .key {
    border: none; border-radius: 13px; background: var(--card);
    color: var(--ink); font-size: 19px; font-weight: 500;
    height: 58px; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: transform .08s ease, background .12s ease;
    user-select: none;
  }
  .key:active { transform: scale(0.95); background: #e9e9e9; }
  .key.fn { font-size: 14px; color: var(--accent); font-weight: 600; }
  .key.op { color: var(--accent); font-weight: 600; }
  .key.eq { background: var(--accent); color: #fff; }
  .key.eq:active { background: #1558c9; }
  .key.del { color: var(--bad); }

  /* 通用表单 */
  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 11.5px; color: var(--soft);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 14px; font-family: inherit;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
  }
  .field textarea { resize: vertical; min-height: 62px; font-family: ui-monospace, Menlo, monospace; }

  .btn {
    padding: 12px 18px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font-size: 14px;
    font-weight: 600; font-family: inherit; margin-right: 8px;
  }
  .btn:active { opacity: .8; }
  .btn.ghost { background: var(--card); color: var(--ink); }

  .out {
    background: var(--card); border-radius: 12px; padding: 13px;
    font-size: 13.5px; line-height: 1.7;
    font-family: ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
    margin-top: 10px; min-height: 20px;
  }
  .out.err { color: var(--bad); }
  .out .k { color: var(--soft); }
  .out .v { color: var(--good); font-weight: 600; }

  canvas.graph {
    width: 100%; display: block; border-radius: 12px;
    border: 1px solid var(--line);
    touch-action: none;
  }
  .hint { font-size: 11px; color: var(--faint); margin-top: 6px; line-height: 1.6; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
</style>
</head>
<body>

<div class="tabs" id="tabs"></div>
<div class="panels" id="panels"></div>

<script src="engine.js"></script>
<script src="plot.js"></script>
<script src="calc.js"></script>
</body>
</html>
