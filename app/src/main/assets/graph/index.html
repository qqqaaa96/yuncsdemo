<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>函数图像</title>
<style>
  :root{
    --bg:#fff; --card:#f6f6f6; --ink:#111; --soft:#666;
    --faint:#9a9a9a; --line:#e6e6e6; --accent:#1b6ef3; --bad:#cc2222;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{padding:10px 12px 24px}

  .modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .modes::-webkit-scrollbar{display:none}
  .mode{flex:none;padding:6px 12px;border-radius:14px;background:var(--card);
    color:var(--soft);font-size:12px;border:none;font-family:inherit;white-space:nowrap}
  .mode.on{background:var(--accent);color:#fff;font-weight:600}

  .field{margin-bottom:8px}
  .field label{display:block;font-size:11px;color:var(--soft);margin-bottom:4px}
  .field input{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:13px;font-family:ui-monospace,Menlo,monospace;outline:none}
  .field input:focus{border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .presets{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
  .presets::-webkit-scrollbar{display:none}
  .preset{flex:none;padding:5px 10px;border-radius:12px;background:var(--card);
    color:var(--soft);font-size:11.5px;border:none;font-family:inherit;white-space:nowrap}

  .canvasBox{position:relative;margin:6px 0}
  canvas{width:100%;display:block;border-radius:12px;border:1px solid var(--line);
    background:#fdfcf9;touch-action:none}

  .params{margin-top:8px}
  .paramRow{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .paramRow .nm{font-size:12.5px;font-weight:600;color:var(--accent);
    font-family:ui-monospace,Menlo,monospace;min-width:22px}
  .paramRow .vl{font-size:11.5px;color:var(--soft);font-family:ui-monospace,Menlo,monospace;
    min-width:46px;text-align:right}
  .paramRow input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;
    background:var(--line);outline:none}
  .paramRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:16px;
    border-radius:8px;background:#fff;border:1px solid #ddd;box-shadow:0 1px 3px rgba(0,0,0,.18)}

  .info{margin-top:8px;font-size:11px;color:var(--soft);line-height:1.6;
    white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
  .err{color:var(--bad)}
</style>
</head>
<body>

<div class="modes" id="modes"></div>

<div class="field">
  <label id="lbl">表达式</label>
  <input id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>

<div class="row2">
  <div class="field">
    <label>X 范围</label>
    <input id="xr" type="text" value="-10,10">
  </div>
  <div class="field">
    <label>Y 范围</label>
    <input id="yr" type="text" value="-10,10">
  </div>
</div>

<div class="presets" id="presets"></div>

<div class="canvasBox"><canvas id="cv"></canvas></div>

<div class="params" id="params"></div>
<div class="info" id="info"></div>

<script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
<script src="graph.js"></script>
</body>
</html>
