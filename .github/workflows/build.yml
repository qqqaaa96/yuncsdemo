name: Build csdemo APK

# Builds the csdemo app and produces a debug APK.
# Kept in sync with the KernelSU manager build: JDK 21, Gradle 9.7.1, AGP 9.4.1.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 显式安装 NDK。
      #
      # app/build.gradle.kts 里固定了 ndkVersion = 27.0.12077973，
      # 而 ubuntu-latest runner 预装的 NDK 版本不一定是它。
      # 不显式安装时 AGP 会尝试自动下载，
      # 遇到 Google 下载源限流或该版本下线就直接 InstallFailedException 整体失败。
      - name: Install NDK 27.0.12077973
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: csdemo-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
