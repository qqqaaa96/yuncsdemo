# NOTE: android.aapt2FromMavenOverride was removed on purpose.
# It pointed at /usr/bin/aapt2 which only exists inside AndroidIDE and
# breaks any normal CI / PC build (GitHub Actions, Android Studio).

android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
